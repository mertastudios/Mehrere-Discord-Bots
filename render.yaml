# ============================================================
#  Render Blueprint – https://render.com
#  Erstelle das Projekt einmalig über "New > Blueprint" und
#  verlinke dieses GitHub-Repository. Render liest diese Datei
#  automatisch und legt den Web-Service an.
#
#  WICHTIG: Alle Variablen mit `sync: false` musst du nach dem
#  Deployment einmalig im Render-Dashboard ausfüllen
#  (Service > Environment). Sie werden NIE aus GitHub gelesen!
# ============================================================

services:
  - type: web
    name: multi-discord-bot-hoster
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # --- Geburtstags-Bot ---
      - key: BIRTHDAY_BOT_TOKEN
        sync: false
      - key: BIRTHDAY_BOT_OWNER_ID
        sync: false
      - key: BIRTHDAY_BOT_GUILD_ID
        sync: false
      # --- XP-Level-Bot ---
      - key: XP_BOT_TOKEN
        sync: false
      - key: XP_BOT_OWNER_ID
        sync: false
      - key: XP_BOT_GUILD_ID
        sync: false
      # Turso (Datenbank des XP-Bots & Security-Bots)
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      # --- Sicherheits-Bot 🛡️ (KI-Moderation über Groq) ---
      - key: SECURITY_BOT_TOKEN
        sync: false
      - key: SECURITY_BOT_OWNER_ID
        sync: false
      - key: SECURITY_BOT_GUILD_ID
        sync: false
      # Optional: Groq-Key zentral (sonst pro Server über /setup Schritt 7)
      - key: SECURITY_GROQ_API_KEY
        sync: false
      # --- Self-Roles-Bot 🎭 (ohne Datenbank) ---
      - key: SELF_ROLES_BOT_TOKEN
        sync: false
      - key: SELF_ROLES_BOT_OWNER_ID
        sync: false
      - key: SELF_ROLES_BOT_GUILD_ID
        sync: false
      # --- Minigames-Bot 🎮 (ohne Datenbank) ---
      - key: MINIGAMES_BOT_TOKEN
        sync: false
      - key: MINIGAMES_BOT_OWNER_ID
        sync: false
      - key: MINIGAMES_BOT_GUILD_ID
        sync: false
      # Alte Verify-Werte bleiben als Deployment-Fallback erhalten.
      - key: VERIFY_BOT_TOKEN
        sync: false
      - key: VERIFY_BOT_OWNER_ID
        sync: false
      - key: VERIFY_BOT_GUILD_ID
        sync: false
